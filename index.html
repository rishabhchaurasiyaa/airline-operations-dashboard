<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airline Flight Operations Dashboard</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.main-content{margin-left:260px;padding:105px 30px 35px;min-height:100vh}.sidebar{position:fixed;top:76px;bottom:0;left:0;width:240px;overflow:auto}
.nav-item{display:flex;gap:12px;align-items:center;padding:13px 18px;color:inherit}.nav-item.active{background:#e8efff;color:#1d4ed8;border-radius:9px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.page-header h2{font-size:26px}.page-description{color:#64748b;margin-top:7px}
.dashboard-card,.content-card{background:white;border-radius:14px;padding:22px;margin-bottom:22px;box-shadow:0 4px 18px #0f172a0b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:22px}.stat-card{background:#fff;border-radius:13px;padding:20px;box-shadow:0 4px 18px #0f172a0b}.stat-number{font-size:30px;font-weight:700;margin-top:10px}.stat-label{color:#64748b}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-group{display:flex;flex-direction:column;gap:7px}.form-group.full-width{grid-column:1/-1}.form-group input,.form-group select,.form-group textarea,.search-input{padding:11px 12px;border:1px solid #dbe2ea;border-radius:8px;width:100%;background:white}.primary-button,.secondary-button,.edit-button,.delete-button{border:0;border-radius:8px;padding:10px 15px;font-weight:600}.primary-button{background:#2563eb;color:white}.secondary-button{background:#e2e8f0;color:#1e293b}.edit-button{background:#dbeafe;color:#1d4ed8;margin-right:5px}.delete-button{background:#fee2e2;color:#b91c1c}
.table-container,.table-responsive{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{font-size:12px;color:#64748b;text-transform:uppercase;background:#f8fafc}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:15px}.toolbar input{max-width:320px}.status-badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e2e8f0;font-size:12px}.status-on-time,.status-available,.status-resolved,.status-in-service{background:#dcfce7;color:#166534}.status-delayed,.status-open,.status-maintenance{background:#fef3c7;color:#92400e}.status-cancelled,.status-high{background:#fee2e2;color:#991b1b}.system-message{padding:12px;border-radius:8px;margin-bottom:15px;background:#dcfce7;color:#166534}.empty-state{padding:25px;text-align:center;color:#64748b}.sidebar-footer{padding:20px}.mobile-menu{display:none}
@media(max-width:800px){.sidebar{display:none}.main-content{margin-left:0;padding:95px 15px 25px}.topbar{padding:0 15px}.topbar-right .status-indicator{display:none}.form-grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="brand-icon">✈️</div><div><h1>Airline Operations</h1><span>Your day-to-day flight control desk</span></div></div><div class="topbar-right"><div class="status-indicator"><span class="status-dot"></span>Ready for operations</div><div class="admin-profile"><div class="admin-avatar">A</div><div><strong>Operations Team</strong><small>Workspace</small></div></div></div></header>
<aside class="sidebar"><div class="sidebar-title">WORKSPACE</div><nav class="sidebar-nav" id="navigation"></nav><div class="sidebar-footer"><div class="system-status"><span class="status-dot"></span><div><strong>Your workspace</strong><small>Saved on this device</small></div></div></div></aside>
<main class="main-content" id="app"></main><script src="assets/js/app.js"></script></body></html>
